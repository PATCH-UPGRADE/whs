name: CI/CD Pipeline

env:
  NODE_VERSION: '20'
  REGISTRY_IMAGE: ghcr.io/patch-upgrade/whs
on:
  push:
    branches: [main, develop]
    tags: ['*']
  pull_request:
    branches: [main, develop]
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read
  packages: write

jobs:
  build-and-lint:
    name: Lint, TypeScript Type, & Dependency Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Dependency security audit
        run: npm audit --omit=dev --audit-level critical 

      - name: Check formatting/lint
        run: npx biome ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Run production build
        run: npm run build

      - name: Pack dist artifact
        run: tar -czf dist.tar.gz dist

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist.tar.gz

  run-npm-tests:
    name: Run npm tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test

  test-deployment:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/hadron/carthage:latest
      options: --privileged
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    env:
      USER: root

    steps:
      - uses: actions/checkout@v6
      - name: Install prerequisites
        run: apt update && apt install -y qemu-system-arm qemu-efi-aarch64 python3-pytest python3-fastapi python3-libvirt iproute2 iptables procps
      - name: Run libvirt/qemu as root # Avoids libvirt-qemu pytest directory permission issues
        run: |
          sed -i 's/#user = "root"/user = "root"/' /etc/libvirt/qemu.conf 
          sed -i 's/#group = "root"/group = "root"/' /etc/libvirt/qemu.conf
      - name: Start libvirtd
        run: |
          /usr/sbin/virtlogd -d
          /usr/sbin/libvirtd -d
      - name: Create WHS lab bridge
        run: |
          ip link show whs-lab >/dev/null 2>&1 || ip link add whs-lab type bridge
          ip link set whs-lab up
          if ! podman network inspect net >/dev/null 2>&1; then
            ip addr del 10.20.100.1/24 dev whs-lab >/dev/null 2>&1 || true
            podman network create net \
              -d bridge \
              -o com.docker.network.bridge.name=whs-lab \
              --label carthage.layout=whs \
              --subnet 10.20.100.0/24 \
              --gateway 10.20.100.1 \
              -o mode=unmanaged
          fi
          ip addr replace 10.20.100.1/24 dev whs-lab
          sysctl -w net.ipv4.ip_forward=1
          iptables -C FORWARD -i whs-lab -j ACCEPT || iptables -A FORWARD -i whs-lab -j ACCEPT
          iptables -C FORWARD -o whs-lab -m conntrack --ctstate RELATED,ESTABLISHED -j ACCEPT || iptables -A FORWARD -o whs-lab -m conntrack --ctstate RELATED,ESTABLISHED -j ACCEPT
          iptables -t nat -C POSTROUTING -s 10.20.100.0/24 ! -o whs-lab -j MASQUERADE || iptables -t nat -A POSTROUTING -s 10.20.100.0/24 ! -o whs-lab -j MASQUERADE
      - name: Obtain Debian VM image
        run: |
          mkdir -p /srv/carthage/libvirt/whs-ci/images
          wget https://cloud.debian.org/images/cloud/trixie/latest/debian-13-nocloud-arm64.qcow2 -P /srv/carthage/libvirt/whs-ci/images
      - name: Run deployment tests
        env:
          WHS_TEST_VM_IMAGE_DIR: /srv/carthage/libvirt/whs-ci
        run: mkdir -p /srv/whs-pytest && cd layout && pytest -vv --basetemp=/srv/whs-pytest

  container_build_production:
    name: Build production container image (${{ matrix.image_suffix }})
    strategy:
      matrix:
        include:
          - runs_on: ubuntu-24.04
            image_suffix: amd64
          - runs_on: ubuntu-24.04-arm
            image_suffix: aarch64
    runs-on: ${{ matrix.runs_on }}
    needs:
      - build-and-lint
      - test-deployment
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))

    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/container-build
        with:
          image_tag: whs:${{ matrix.image_suffix }}

      - name: Log into ghcr.io
        uses: redhat-actions/podman-login@v1
        with:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          registry: ghcr.io

      - name: Push arch image
        env:
          IMAGE_SUFFIX: ${{ matrix.image_suffix }}
          PUBLISH_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'latest' }}
        run: |
          podman tag "whs:${IMAGE_SUFFIX}" "${REGISTRY_IMAGE}:${PUBLISH_TAG}-${IMAGE_SUFFIX}"
          podman push "${REGISTRY_IMAGE}:${PUBLISH_TAG}-${IMAGE_SUFFIX}"

  publish_production_manifest:
    name: Publish production multi-arch manifest
    needs:
      - container_build_production
    runs-on: ubuntu-24.04
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
    steps:
      - name: Log into ghcr.io
        uses: redhat-actions/podman-login@v1
        with:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          registry: ghcr.io

      - name: Publish manifest
        env:
          PUBLISH_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'latest' }}
        run: |
          manifest="localhost/whs-manifest:${GITHUB_RUN_ID}-${PUBLISH_TAG}"
          podman manifest create "${manifest}"
          podman manifest add "${manifest}" "docker://${REGISTRY_IMAGE}:${PUBLISH_TAG}-amd64"
          podman manifest add "${manifest}" "docker://${REGISTRY_IMAGE}:${PUBLISH_TAG}-aarch64"
          podman manifest push --all "${manifest}" "docker://${REGISTRY_IMAGE}:${PUBLISH_TAG}"
          podman manifest rm "${manifest}"

  container_build_develop:
    name: Build develop container image (${{ matrix.image_suffix }})
    strategy:
      matrix:
        include:
          - runs_on: ubuntu-24.04
            image_suffix: amd64
          - runs_on: ubuntu-24.04-arm
            image_suffix: aarch64
    runs-on: ${{ matrix.runs_on }}
    needs:
      - build-and-lint
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'

    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/container-build
        with:
          image_tag: whs:${{ matrix.image_suffix }}

      - name: Log into ghcr.io
        uses: redhat-actions/podman-login@v1
        with:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          registry: ghcr.io

      - name: Push development arch image
        env:
          IMAGE_SUFFIX: ${{ matrix.image_suffix }}
        run: |
          podman tag "whs:${IMAGE_SUFFIX}" "${REGISTRY_IMAGE}:develop-${IMAGE_SUFFIX}"
          podman push "${REGISTRY_IMAGE}:develop-${IMAGE_SUFFIX}"

  publish_develop_manifest:
    name: Publish develop multi-arch manifest
    needs:
      - container_build_develop
    runs-on: ubuntu-24.04
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    steps:
      - name: Log into ghcr.io
        uses: redhat-actions/podman-login@v1
        with:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          registry: ghcr.io

      - name: Publish develop manifest
        run: |
          manifest="localhost/whs-manifest:${GITHUB_RUN_ID}-develop"
          podman manifest create "${manifest}"
          podman manifest add "${manifest}" "docker://${REGISTRY_IMAGE}:develop-amd64"
          podman manifest add "${manifest}" "docker://${REGISTRY_IMAGE}:develop-aarch64"
          podman manifest push --all "${manifest}" "docker://${REGISTRY_IMAGE}:develop"
          podman manifest rm "${manifest}"
