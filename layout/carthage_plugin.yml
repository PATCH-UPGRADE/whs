name: whs
dependencies:
  - deb: python3-fastapi
  - deb: python3-python-multipart
  - deb: python3-sqlalchemy
  - deb: python3-openssl
  - pypi: entanglement @ git+https://github.com/hadron/entanglement@master
config:
  authorized_keys: /dev/null
  base_dir: /srv/whs
  debian:
    distribution: trixie
  container_prefix: 'whs-'
  plugins:
    - carthage.libvirt
    - carthage.podman
    - https://github.com/hadron/carthage-base
    - carthage.entanglement
